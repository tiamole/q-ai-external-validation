name: Reproducibility

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --requirement requirements-lock.txt
      - name: Download and verify source artifacts
        run: python src/download_sources.py
      - name: Reproduce source analysis
        run: |
          python src/validate_inputs.py
          python src/reproduce_source.py
      - name: Run prespecified robustness analysis
        run: python src/robustness.py
      - name: Run tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Verify frozen checksums
        run: python src/verify_checksums.py
